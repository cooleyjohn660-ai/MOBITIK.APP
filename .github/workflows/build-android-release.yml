name: Build Signed Android Release AAB & APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Platform and Build Tools
        run: |
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-36" "platforms;android-36.1" "build-tools;36.0.0"

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Restore debug.keystore & Generate Release Keystore
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'MobitikRelease2026!' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'MobitikRelease2026!' }}
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f my-upload-key.jks ]; then
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$STORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -dname "CN=MOBITIK, OU=Mobile, O=Mobitik, L=City, S=State, C=US"
          fi

      - name: Build Signed Release AAB & APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'MobitikRelease2026!' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'MobitikRelease2026!' }}
        run: |
          gradle :app:bundleRelease :app:assembleRelease --no-daemon

      - name: Upload Google Play AAB Bundle (.aab)
        uses: actions/upload-artifact@v4
        with:
          name: MOBITIK-PlayStore-Release-AAB
          path: app/build/outputs/bundle/release/*.aab

      - name: Upload Signed Release APK (.apk) & Keystore
        uses: actions/upload-artifact@v4
        with:
          name: MOBITIK-Release-APK-and-Keystore
          path: |
            app/build/outputs/apk/release/*.apk
            my-upload-key.jks
